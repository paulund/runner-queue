name: ci

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes this run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The lower bound of `engines`, and the current release.
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      # Typecheck first: it is the cheaper failure and the one that catches
      # mistakes in the shape of the data passed between modules.
      - run: npm run check
        env:
          NO_COLOR: "1"
